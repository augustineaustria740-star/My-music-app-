<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AustrioPhy - Free Music Forever</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1DB954">
<link rel="icon" href="icon.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Inter,system-ui,sans-serif;padding-bottom:160px}
.header{position:sticky;top:0;z-index:10;background:#000;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #222}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:22px}
.logo img{width:32px;height:32px;border-radius:8px}
.btn{background:#1DB954;color:#000;border:none;padding:8px 14px;border-radius:20px;font-weight:700;cursor:pointer}
.search-box{margin:12px 16px;background:#181818;border-radius:28px;display:flex;align-items:center;padding:10px 16px}
.search-box input{flex:1;background:transparent;border:none;color:#fff;outline:none;font-size:16px}
.tabs{display:flex;gap:8px;padding:0 16px;overflow:auto}
.tab{padding:8px 16px;border-radius:20px;background:#222;color:#aaa;white-space:nowrap;cursor:pointer}
.tab.active{background:#fff;color:#000;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.card{background:#181818;border-radius:12px;padding:10px;cursor:pointer}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#222}
.card h4{margin-top:8px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card p{font-size:12px;color:#aaa}
.card .actions{display:flex;gap:6px;margin-top:6px}
.small-btn{background:#222;border:none;color:#fff;padding:4px 8px;border-radius:12px;font-size:11px;cursor:pointer}
.player{position:fixed;left:0;right:0;bottom:80px;background:#181818;border-top:1px solid #333;padding:10px 16px;display:flex;align-items:center;gap:12px;z-index:20}
.player img{width:56px;height:56px;border-radius:8px}
.player-info{flex:1;overflow:hidden}
.player-info h4{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{height:4px;background:#333;border-radius:2px;margin-top:6px;overflow:hidden}
.progress div{height:100%;background:#1DB954;width:0%}
.player-controls{display:flex;gap:8px}
.player-controls button{background:#fff;color:#000;border:none;width:36px;height:36px;border-radius:50%;font-weight:900;cursor:pointer}
.nav{position:fixed;left:0;right:0;bottom:0;height:80px;background:#000;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;z-index:30}
.nav-item{display:flex;flex-direction:column;align-items:center;font-size:10px;color:#aaa;cursor:pointer;gap:4px}
.nav-item.active{color:#fff}
.nav-item span{font-size:20px}
.upload-area{margin:16px;background:#181818;padding:16px;border-radius:12px;display:none}
.upload-area input,.upload-area textarea{width:100%;margin-top:8px;padding:10px;border-radius:8px;border:none;background:#222;color:#fff}
.lyrics-box{max-height:300px;overflow:auto;background:#000;padding:12px;border-radius:8px;white-space:pre-wrap;margin-top:10px;font-size:14px;line-height:1.6}
</style>
</head>
<body>

<div class="header">
<div class="logo"><img src="icon.png" onerror="this.src='https://via.placeholder.com/32/1DB954/000?text=A'"> AustrioPhy</div>
<button class="btn" id="installBtn" style="display:none">📲 Download App</button>
</div>

<div class="search-box">
<input id="searchInput" placeholder="Search any song, Rema, Burna...">
<span onclick="doSearch()" style="cursor:pointer">🔍</span>
</div>

<div class="tabs">
<div class="tab active" onclick="switchTab('home',this)">Home</div>
<div class="tab" onclick="switchTab('live',this)">Live Worldwide</div>
<div class="tab" onclick="switchTab('mymusic',this)">My Uploads</div>
<div class="tab" onclick="showUpload()">+ Upload</div>
</div>

<div id="homeGrid" class="grid"></div>
<div id="liveGrid" class="grid" style="display:none"></div>

<div id="uploadArea" class="upload-area">
<h3>Upload Your Song</h3>
<input id="songTitle" placeholder="Song Title">
<input id="artistName" placeholder="Artist Name">
<input type="file" id="audioFile" accept="audio/*">
<input type="file" id="coverFile" accept="image/*">
<textarea id="lyricsInput" placeholder="Paste Lyrics here..."></textarea>
<button class="btn" onclick="uploadSong()" style="width:100%;margin-top:10px">Upload & Publish Worldwide</button>
</div>

<div id="player" class="player" style="display:none">
<img id="pCover" src="">
<div class="player-info">
<h4 id="pTitle">Title</h4>
<p id="pArtist" style="font-size:12px;color:#aaa">Artist</p>
<div class="progress"><div id="pBar"></div></div>
</div>
<div class="player-controls">
<button onclick="toggleLyrics()">🎤</button>
<button onclick="togglePlay()">⏯️</button>
</div>
</div>

<div id="lyricsModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:50;padding:20px;overflow:auto">
<div style="display:flex;justify-content:space-between"><h3 id="lyricTitle">Lyrics</h3><button onclick="toggleLyrics()" class="btn">Close</button></div>
<div id="lyricContent" class="lyrics-box"></div>
<div id="ytPlayer" style="margin-top:12px;display:none"><iframe id="ytFrame" width="100%" height="200" frameborder="0" allow="autoplay"></iframe></div>
</div>

<div class="nav">
<div class="nav-item active" onclick="switchTab('home',document.querySelector('.tabs .tab'))"><span>🏠</span>Home</div>
<div class="nav-item" onclick="switchTab('live',document.querySelectorAll('.tabs .tab')[1])"><span>🌍</span>Live</div>
<div class="nav-item" onclick="doSearch()"><span>🔍</span>Search</div>
<div class="nav-item" onclick="showUpload()"><span>⬆️</span>Upload</div>
<div class="nav-item" onclick="switchTab('mymusic',document.querySelectorAll('.tabs .tab')[2])"><span>🎵</span>My Music</div>
</div>

<audio id="audio"></audio>

<script>
let songs = JSON.parse(localStorage.getItem('austrio_songs')||'[]');
let currentSong=null;
let isPlaying=false;
let audio=document.getElementById('audio');

const defaultSongs=[
{title:"Calm Down",artist:"Rema",cover:"https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?q=80&w=200",lyrics:"Calm down, calm down...",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"},
{title:"Last Last",artist:"Burna Boy",cover:"https://images.unsplash.com/photo-1511379938547-c1f69419868d?q=80&w=200",lyrics:"Last last, na everybody go chop breakfast...",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"}
];

function renderHome(){
let all=[...defaultSongs,...songs];
document.getElementById('homeGrid').innerHTML=all.map((s,i)=>`
<div class="card" onclick="playSong(${i},'home')">
<img src="${s.cover}" onerror="this.src='icon.png'"><h4>${s.title}</h4><p>${s.artist}</p>
<div class="actions"><button class="small-btn" onclick="event.stopPropagation();showLyrics('${s.title}','${(s.lyrics||'').replace(/'/g,'')}')">🎤 Lyrics</button></div>
</div>`).join('');
}
renderHome();

function switchTab(t,el){
document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
if(el) el.classList.add('active');
document.getElementById('homeGrid').style.display=t==='home'?'grid':'none';
document.getElementById('liveGrid').style.display=t==='live'?'grid':'none';
document.getElementById('uploadArea').style.display='none';
if(t==='live' && document.getElementById('liveGrid').innerHTML==='') doSearch('Rema');
if(t==='mymusic'){
document.getElementById('homeGrid').style.display='grid';
document.getElementById('homeGrid').innerHTML=songs.length?songs.map((s,i)=>`
<div class="card" onclick="playSong(${i+defaultSongs.length},'home')"><img src="${s.cover}"><h4>${s.title}</h4><p>${s.artist}</p></div>`).join(''):'<p style="padding:20px">No uploads yet</p>';
}
}

function showUpload(){document.getElementById('uploadArea').style.display='block';window.scrollTo(0,0)}

function uploadSong(){
let title=document.getElementById('songTitle').value;
let artist=document.getElementById('artistName').value;
let lyrics=document.getElementById('lyricsInput').value;
let audioFile=document.getElementById('audioFile').files[0];
let coverFile=document.getElementById('coverFile').files[0];
if(!title||!artist||!audioFile) return alert('Fill title, artist and audio');
let readerAudio=new FileReader();
let readerCover=new FileReader();
readerAudio.onload=function(e){
let audioUrl=e.target.result;
let coverUrl="icon.png";
let finish=()=>{
let newSong={title,artist,lyrics,cover:coverUrl,url:audioUrl};
songs.push(newSong);
localStorage.setItem('austrio_songs',JSON.stringify(songs));
alert('Uploaded! Now plays FULL duration');
renderHome();
};
if(coverFile){
readerCover.onload=function(ev){coverUrl=ev.target.result;finish();}
readerCover.readAsDataURL(coverFile);
}else finish();
};
readerAudio.readAsDataURL(audioFile);
}

function playSong(i,from){
let list=from==='home'?[...defaultSongs,...songs]:window.liveSongs;
let s=list[i]||list[0];
if(!s) return;
currentSong=s;
document.getElementById('player').style.display='flex';
document.getElementById('pCover').src=s.cover;
document.getElementById('pTitle').innerText=s.title;
document.getElementById('pArtist').innerText=s.artist;
if(s.url.startsWith('data:')||s.url.includes('.mp3')){
document.getElementById('ytPlayer').style.display='none';
audio.src=s.url;audio.play();isPlaying=true;
}else{
// worldwide full play via YouTube search
let q=encodeURIComponent(s.title+' '+s.artist+' official');
document.getElementById('ytPlayer').style.display='block';
document.getElementById('ytFrame').src=`https://www.youtube.com/embed?listType=search&list=${q}&autoplay=1`;
showLyrics(s.title,s.lyrics||'Full version playing via YouTube');
audio.pause();
}
}

audio.ontimeupdate=function(){let p=(audio.currentTime/audio.duration)*100;document.getElementById('pBar').style.width=p+'%';}
function togglePlay(){if(isPlaying){audio.pause();isPlaying=false;}else{audio.play();isPlaying=true;}}
function showLyrics(title,lyrics){document.getElementById('lyricTitle').innerText=title+' - Lyrics';document.getElementById('lyricContent').innerText=lyrics||'Lyrics not available yet';document.getElementById('lyricsModal').style.display='block';}
function toggleLyrics(){let m=document.getElementById('lyricsModal');m.style.display=m.style.display==='none'?'block':'none';}

async function doSearch(q){
let query=q||document.getElementById('searchInput').value||'Rema';
switchTab('live',document.querySelectorAll('.tabs .tab')[1]);
document.getElementById('liveGrid').innerHTML='<p style="padding:20px">Searching...</p>';
try{
let res=await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=12`);
let data=await res.json();
window.liveSongs=data.results.map(r=>({title:r.trackName,artist:r.artistName,cover:r.artworkUrl100,url:r.previewUrl,lyrics:`${r.trackName} by ${r.artistName}\n\nLyrics loading...\nSearch on Google for full lyrics.`}));
document.getElementById('liveGrid').innerHTML=window.liveSongs.map((s,i)=>`
<div class="card" onclick="playSong(${i},'live')">
<img src="${s.cover}"><h4>${s.title}</h4><p>${s.artist}</p>
<div class="actions"><button class="small-btn" onclick="event.stopPropagation();showLyrics('${s.title.replace(/'/g,'')}','${s.lyrics.replace(/'/g,'')}')">🎤 Lyrics</button><button class="small-btn">▶️ Play Full</button></div>
</div>`).join('');
}catch(e){document.getElementById('liveGrid').innerHTML='<p>Search failed</p>';}
}

// PWA install
let deferredPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').style.display='block';});
document.getElementById('installBtn').addEventListener('click',()=>{if(deferredPrompt)deferredPrompt.prompt();});
</script>
</body>
  </html>
